<svg xmlns="http://www.w3.org/2000/svg" width="555" height="331" viewBox="0 0 555 331" role="img" aria-labelledby="title desc">
<title id="title">Hàng đợi vòng tròn SPSC — Lock-free</title>
<desc id="desc">CPU producer owns tail and NPU consumer owns head. Slots 0 and 1 are free; slot 2 is running at head = 2; slots 3 to 5 are submitted; slot 6 is free at tail = 6; slot 7 is free. The queue wraps after slot 63 to slot 0. Empty when head equals tail. Full when (tail + 1) modulo size equals head.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6d7068" stroke-width="1.4"/></marker></defs>
<rect width="555" height="331" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif">
<text x="285" y="27" text-anchor="middle" font-size="12" fill="#393c36" font-weight="600">Hàng đợi vòng tròn SPSC — Lock-free</text><text x="285" y="43" text-anchor="middle" font-size="10" fill="#6c6e67">CPU producer (sở hữu tail) · NPU consumer (sở hữu head)</text><text x="35" y="94" text-anchor="middle" font-size="12" fill="#6c6e67">...</text><text x="535" y="94" text-anchor="middle" font-size="12" fill="#6c6e67">...</text><rect x="59.5" y="58" width="51" height="66" rx="4" fill="#f1efe8" stroke="#b9b9b0" stroke-width=".8"/><text x="85" y="79" text-anchor="middle" font-size="10" fill="#73756e">0</text><text x="85" y="109" text-anchor="middle" font-size="10" fill="#73756e">FREE</text><rect x="116.7" y="58" width="51" height="66" rx="4" fill="#f1efe8" stroke="#b9b9b0" stroke-width=".8"/><text x="142.2" y="79" text-anchor="middle" font-size="10" fill="#73756e">1</text><text x="142.2" y="109" text-anchor="middle" font-size="10" fill="#73756e">FREE</text><rect x="173.9" y="58" width="51" height="66" rx="4" fill="#fcefd9" stroke="#caa370" stroke-width=".8"/><text x="199.4" y="79" text-anchor="middle" font-size="10" fill="#85551e">2</text><text x="199.4" y="109" text-anchor="middle" font-size="12" fill="#85551e" font-weight="600">RUN</text><rect x="231.10000000000002" y="58" width="51" height="66" rx="4" fill="#e5f1fd" stroke="#88b8ef" stroke-width=".8"/><text x="256.6" y="79" text-anchor="middle" font-size="10" fill="#357fca">3</text><text x="256.6" y="109" text-anchor="middle" font-size="10" fill="#357fca">SUB</text><rect x="288.3" y="58" width="51" height="66" rx="4" fill="#e5f1fd" stroke="#88b8ef" stroke-width=".8"/><text x="313.8" y="79" text-anchor="middle" font-size="10" fill="#357fca">4</text><text x="313.8" y="109" text-anchor="middle" font-size="10" fill="#357fca">SUB</text><rect x="345.5" y="58" width="51" height="66" rx="4" fill="#e5f1fd" stroke="#88b8ef" stroke-width=".8"/><text x="371" y="79" text-anchor="middle" font-size="10" fill="#357fca">5</text><text x="371" y="109" text-anchor="middle" font-size="10" fill="#357fca">SUB</text><rect x="402.70000000000005" y="58" width="51" height="66" rx="4" fill="#f1efe8" stroke="#b9b9b0" stroke-width=".8"/><text x="428.20000000000005" y="79" text-anchor="middle" font-size="10" fill="#73756e">6</text><text x="428.20000000000005" y="109" text-anchor="middle" font-size="10" fill="#73756e">FREE</text><rect x="459.90000000000003" y="58" width="51" height="66" rx="4" fill="#f1efe8" stroke="#b9b9b0" stroke-width=".8"/><text x="485.40000000000003" y="79" text-anchor="middle" font-size="10" fill="#73756e">7</text><text x="485.40000000000003" y="109" text-anchor="middle" font-size="10" fill="#73756e">FREE</text><path d="M199.4 165V125" fill="none" stroke="#6d7068" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M428.2 165V125" fill="none" stroke="#6d7068" stroke-width="1.3" marker-end="url(#arrow)"/><text x="199.4" y="183" text-anchor="middle" font-size="12" fill="#464941" font-weight="600">head = 2</text><text x="199.4" y="199" text-anchor="middle" font-size="10" fill="#6c6e67">NPU cập nhật · đang đọc</text><text x="428.2" y="183" text-anchor="middle" font-size="12" fill="#464941" font-weight="600">tail = 6</text><text x="428.2" y="199" text-anchor="middle" font-size="10" fill="#6c6e67">CPU cập nhật · sẽ ghi</text><text x="285" y="222" text-anchor="middle" font-size="10" fill="#6c6e67">↺ vòng tròn — sau slot 63 quay về slot 0 (mod 64)</text><rect x="129" y="231" width="312" height="47" rx="7" fill="#f1efe8" stroke="#b9b9b0"/><text x="285" y="253" text-anchor="middle" font-size="12" fill="#595c54" font-weight="600">empty: head == tail</text><text x="285" y="271" text-anchor="middle" font-size="12" fill="#595c54" font-weight="600">full: (tail + 1) % size == head</text><rect x="116" y="291" width="61" height="18" rx="4" fill="#f1efe8" stroke="#b9b9b0" stroke-width=".8"/><text x="146.5" y="324" text-anchor="middle" font-size="10" fill="#6c6e67">FREE</text><rect x="185.4" y="291" width="61" height="18" rx="4" fill="#e5f1fd" stroke="#88b8ef" stroke-width=".8"/><text x="215.9" y="324" text-anchor="middle" font-size="10" fill="#6c6e67">SUBMITTED</text><rect x="254.8" y="291" width="61" height="18" rx="4" fill="#fcefd9" stroke="#caa370" stroke-width=".8"/><text x="285.3" y="324" text-anchor="middle" font-size="10" fill="#6c6e67">RUNNING</text><rect x="324.20000000000005" y="291" width="61" height="18" rx="4" fill="#e1f4ed" stroke="#89c6b4" stroke-width=".8"/><text x="354.70000000000005" y="324" text-anchor="middle" font-size="10" fill="#6c6e67">DONE</text><rect x="393.6" y="291" width="61" height="18" rx="4" fill="#fcecec" stroke="#e88e8e" stroke-width=".8"/><text x="424.1" y="324" text-anchor="middle" font-size="10" fill="#6c6e67">ERROR</text></g></svg>
