<svg xmlns="http://www.w3.org/2000/svg" width="1204" height="684" viewBox="0 0 1204 684" role="img" aria-labelledby="title desc">
<title id="title">NPU Low-Level Driver</title><desc id="desc">Shared device state and five driver operations: init, submit job, wait job, reset and close. The driver allocates shared queue and arena, submits descriptors, rings the NPU doorbell and receives completion IRQ.</desc><defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#298563"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#245982"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bb352b"/></marker></defs><rect width="1204" height="684" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="21" y="30" width="304" height="607" rx="12" fill="#e8f0fc" stroke="#9bc3f7" stroke-width="1.4"/><text x="173" y="56" font-size="15" fill="#245982" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">sovra_npu_device_t</text><text x="173" y="74" font-size="11" fill="#79759e" text-anchor="middle" font-style="italic">trạng thái thiết bị (dùng chung)</text><text x="37" y="102" font-size="11" fill="#298563" text-anchor="start" font-weight="700">▸ MMIO</text><rect x="37" y="105" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="120" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">uintptr_t</text><text x="111.4" y="120" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">mmio_base</text><text x="305" y="120" font-size="10" fill="#939ba1" text-anchor="end" font-style="italic">base NPU_CTRL</text><text x="37" y="150" font-size="11" fill="#298563" text-anchor="start" font-weight="700">▸ Job Queue (SPSC)</text><rect x="37" y="153" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="168" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">void*</text><text x="85" y="168" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">queue_virt</text><rect x="37" y="180" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="195" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">uint64_t</text><text x="104.8" y="195" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">queue_phys</text><rect x="37" y="208" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="223" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">size_t</text><text x="91.6" y="223" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">queue_size</text><rect x="37" y="235" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="250" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">uint32_t</text><text x="104.8" y="250" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">tail</text><text x="305" y="250" font-size="10" fill="#939ba1" text-anchor="end" font-style="italic">CPU sở hữu</text><text x="37" y="280" font-size="11" fill="#298563" text-anchor="start" font-weight="700">▸ Tensor Arena</text><rect x="37" y="283" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="298" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">void*</text><text x="85" y="298" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">arena_virt</text><rect x="37" y="310" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="325" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">uint64_t</text><text x="104.8" y="325" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">arena_phys</text><rect x="37" y="338" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="353" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">size_t</text><text x="91.6" y="353" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">arena_size</text><text x="37" y="383" font-size="11" fill="#298563" text-anchor="start" font-weight="700">▸ Job tracking</text><rect x="37" y="386" width="273" height="22" rx="4" fill="#fbfdff" stroke="#d3e5fa" stroke-width="1.4"/><text x="45" y="401" font-size="11" fill="#b58022" text-anchor="start" font-family="Consolas, monospace">uint32_t</text><text x="104.8" y="401" font-size="11" fill="#293847" text-anchor="start" font-family="Consolas, monospace">next_job_id</text><text x="305" y="401" font-size="10" fill="#939ba1" text-anchor="end" font-style="italic">id job kế</text><text x="173" y="624" font-size="11" fill="#868b89" text-anchor="middle" font-style="italic">giữ ánh xạ địa chỉ vật lý ↔ ảo của queue &amp; arena</text><rect x="362" y="35" width="404" height="95" rx="9" fill="#fbfaf7" stroke="#d9d6cb" stroke-width="1.4"/><rect x="362" y="35" width="5" height="95" rx="8" fill="#245982" stroke="#245982" stroke-width="1.4"/><text x="382" y="57" font-size="14" fill="#245982" text-anchor="start" font-weight="700" font-family="Consolas, monospace">1</text><text x="403" y="57" font-size="13" fill="#242627" text-anchor="start" font-weight="700" font-family="Consolas, monospace">sovra_driver_init(dev, cfg)</text><text x="403" y="78" font-size="11.5" fill="#73736c" text-anchor="start">map MMIO · cấp phát / map queue + arena</text><text x="403" y="95" font-size="11.5" fill="#73736c" text-anchor="start">lập trình QUEUE_BASE_LO/HI/SIZE</text><text x="403" y="112" font-size="11.5" fill="#73736c" text-anchor="start">kiểm tra VERSION (ABI MAJOR) · reset next_job_id</text><rect x="362" y="143" width="404" height="95" rx="9" fill="#fbfaf7" stroke="#d9d6cb" stroke-width="1.4"/><rect x="362" y="143" width="5" height="95" rx="8" fill="#245982" stroke="#245982" stroke-width="1.4"/><text x="382" y="165" font-size="14" fill="#245982" text-anchor="start" font-weight="700" font-family="Consolas, monospace">2</text><text x="403" y="165" font-size="13" fill="#242627" text-anchor="start" font-weight="700" font-family="Consolas, monospace">sovra_driver_submit_job(dev, desc)</text><text x="403" y="186" font-size="11.5" fill="#73736c" text-anchor="start">job_id = next_job_id++ · ghi descriptor vào queue</text><text x="403" y="203" font-size="11.5" fill="#73736c" text-anchor="start">flush (desc · cmd · input · weights) · memory fence</text><text x="403" y="220" font-size="11.5" fill="#73736c" text-anchor="start">cập nhật tail → ghi DOORBELL</text><rect x="362" y="252" width="404" height="95" rx="9" fill="#fbfaf7" stroke="#d9d6cb" stroke-width="1.4"/><rect x="362" y="252" width="5" height="95" rx="8" fill="#bb352b" stroke="#bb352b" stroke-width="1.4"/><text x="382" y="274" font-size="14" fill="#bb352b" text-anchor="start" font-weight="700" font-family="Consolas, monospace">3</text><text x="403" y="274" font-size="13" fill="#242627" text-anchor="start" font-weight="700" font-family="Consolas, monospace">sovra_driver_wait_job(dev, job_id, ...)</text><text x="403" y="295" font-size="11.5" fill="#73736c" text-anchor="start">chờ IRQ / poll STATUS → DONE / ERROR</text><text x="403" y="312" font-size="11.5" fill="#73736c" text-anchor="start">clear IRQ · invalidate output / status</text><text x="403" y="329" font-size="11.5" fill="#73736c" text-anchor="start">timeout → mã lỗi</text><rect x="362" y="360" width="404" height="68" rx="9" fill="#fbfaf7" stroke="#d9d6cb" stroke-width="1.4"/><rect x="362" y="360" width="5" height="68" rx="8" fill="#927219" stroke="#927219" stroke-width="1.4"/><text x="382" y="382" font-size="14" fill="#927219" text-anchor="start" font-weight="700" font-family="Consolas, monospace">4</text><text x="403" y="382" font-size="13" fill="#242627" text-anchor="start" font-weight="700" font-family="Consolas, monospace">sovra_driver_reset(dev)</text><text x="403" y="403" font-size="11.5" fill="#73736c" text-anchor="start">reset NPU / queue khi timeout hoặc hang</text><text x="403" y="420" font-size="11.5" fill="#73736c" text-anchor="start">đưa hàng đợi về trạng thái xác định</text><rect x="362" y="441" width="404" height="53" rx="9" fill="#fbfaf7" stroke="#d9d6cb" stroke-width="1.4"/><rect x="362" y="441" width="5" height="53" rx="8" fill="#686965" stroke="#686965" stroke-width="1.4"/><text x="382" y="463" font-size="14" fill="#686965" text-anchor="start" font-weight="700" font-family="Consolas, monospace">5</text><text x="403" y="463" font-size="13" fill="#242627" text-anchor="start" font-weight="700" font-family="Consolas, monospace">sovra_driver_close(dev)</text><text x="403" y="484" font-size="11.5" fill="#73736c" text-anchor="start">unmap MMIO · giải phóng queue / arena</text><path d="M326 140H360" stroke="#8c8d91" stroke-dasharray="4 3" fill="none"/><path d="M353 136L361 140L353 144" fill="none" stroke="#8c8d91"/><text x="343" y="131" font-size="10" fill="#79759e" text-anchor="middle" font-style="italic">mọi hàm nhận *dev</text><rect x="931" y="30" width="221" height="138" rx="12" fill="#e2f2eb" stroke="#95d7bf" stroke-width="1.4"/><text x="1041" y="54" font-size="15" fill="#298563" text-anchor="middle" font-weight="700">Shared Memory</text><rect x="945" y="69" width="192" height="35" rx="6" fill="#f3fbf8" stroke="#c1e6d8" stroke-width="1.4"/><text x="1041" y="86" font-size="12" fill="#27312f" text-anchor="middle" font-weight="700">Job Queue (ring)</text><text x="1041" y="99" font-size="10" fill="#879193" text-anchor="middle" font-family="Consolas, monospace">queue_phys</text><rect x="945" y="113" width="192" height="38" rx="6" fill="#f3fbf8" stroke="#c1e6d8" stroke-width="1.4"/><text x="1041" y="129" font-size="12" fill="#27312f" text-anchor="middle" font-weight="700">Tensor Arena + I/O</text><text x="1041" y="143" font-size="10" fill="#879193" text-anchor="middle" font-family="Consolas, monospace">arena_phys</text><rect x="931" y="223" width="221" height="294" rx="12" fill="#eee9fa" stroke="#baa8e8" stroke-width="1.4"/><text x="1041" y="249" font-size="15" fill="#6440ad" text-anchor="middle" font-weight="700">NPU Subsystem</text><rect x="945" y="262" width="192" height="137" rx="8" fill="#f7f4fd" stroke="#d5c7f7" stroke-width="1.4"/><text x="1041" y="281" font-size="12" fill="#6440ad" text-anchor="middle" font-weight="700">NPU_CTRL MMIO</text><text x="1041" y="297" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">DOORBELL</text><text x="1041" y="309.8" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">STATUS</text><text x="1041" y="322.6" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">IRQ_STATUS / CLEAR</text><text x="1041" y="335.4" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">NPU_ACK / NPU_DONE</text><text x="1041" y="348.2" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">QUEUE_BASE_LO/HI</text><text x="1041" y="361" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">QUEUE_SIZE</text><text x="1041" y="373.8" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">VERSION</text><text x="1041" y="386.6" font-size="9.5" fill="#8065b3" text-anchor="middle" font-family="Consolas, monospace">CAPS0 / CAPS1</text><rect x="945" y="407" width="192" height="92" rx="8" fill="#f7f4fd" stroke="#d5c7f7" stroke-width="1.4"/><text x="1041" y="427" font-size="12" fill="#6440ad" text-anchor="middle" font-weight="700">Rocket FW + Gemmini</text><text x="1041" y="446" font-size="10" fill="#8873b7" text-anchor="middle">queue reader · cmd parser</text><text x="1041" y="460" font-size="10" fill="#8873b7" text-anchor="middle">op dispatcher</text><text x="1041" y="479" font-size="10" fill="#8873b7" text-anchor="middle">conv / matmul (tiled)</text><path d="M766 66L931 131" stroke="#298563" stroke-width="1.8" fill="none" marker-end="url(#green)"/><path d="M766 180L931 85" stroke="#298563" stroke-width="1.8" fill="none" marker-end="url(#green)"/><path d="M766 216L931 306" stroke="#245982" stroke-width="2.4" fill="none" marker-end="url(#blue)"/><path d="M931 361L766 298" stroke="#bb352b" stroke-width="2.4" fill="none" marker-end="url(#red)"/><text x="849" y="53" font-size="11" fill="#539f84" text-anchor="middle" font-style="italic">cấp phát</text><text x="849" y="66" font-size="11" fill="#539f84" text-anchor="middle" font-style="italic">queue + arena</text><text x="849" y="169" font-size="10" fill="#539f84" text-anchor="middle" font-style="italic">ghi job → queue</text><text x="849" y="202" font-size="11" fill="#245982" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">DOORBELL</text><text x="849" y="215" font-size="10" fill="#245982" text-anchor="middle" font-style="italic">(CPU → NPU)</text><text x="849" y="276" font-size="11" fill="#bb352b" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">IRQ done</text><text x="849" y="289" font-size="10" fill="#bb352b" text-anchor="middle" font-style="italic">(NPU → CPU)</text><rect x="380" y="639" width="459" height="31" rx="7" fill="#fff9ef" stroke="#ebc583" stroke-width="1.4"/><text x="609.5" y="659" font-size="12" fill="#997013" text-anchor="middle" font-weight="700">↺ Mỗi job: submit_job() → wait_job() | init() / close(): gọi một lần</text></g></svg>
