<script>
  document.addEventListener('click', function (event) {
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) {
      return;
    }

    const link = event.target.closest('.book-menu input.toggle + label a');
    if (!link) {
      return;
    }

    const label = link.closest('label');
    const toggle = label && label.previousElementSibling;
    if (!toggle || !toggle.matches('input.toggle')) {
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    toggle.checked = !toggle.checked;
  });
</script>
<script>
(() => {
  const diagrams = document.querySelectorAll('pre.mermaid');
  if (!diagrams.length) return;
  const dialog = document.createElement('dialog');
  dialog.className = 'diagram-viewer';
  dialog.setAttribute('aria-label', 'Xem sơ đồ phóng to');
  dialog.innerHTML = '<div class="diagram-toolbar"><button type="button" data-action="out" aria-label="Thu nhỏ">−</button><output aria-live="polite"></output><button type="button" data-action="in" aria-label="Phóng to">+</button><button type="button" data-action="fit">Vừa màn hình</button><button type="button" data-action="close">Đóng (Esc)</button></div><div class="diagram-viewport" tabindex="0" aria-label="Sơ đồ, cuộn để xem các phần"></div>';
  document.body.append(dialog);
  const viewport = dialog.querySelector('.diagram-viewport');
  const output = dialog.querySelector('output');
  let active, origin, oldStyle, zoom = 1, width = 1, height = 1;
  function resize(next) {
    zoom = Math.max(0.1, Math.min(4, next));
    active.style.width = `${width * zoom}px`;
    active.style.height = `${height * zoom}px`;
    active.style.maxWidth = 'none';
    output.textContent = `${Math.round(zoom * 100)}%`;
  }
  function fit() {
    resize(Math.min((viewport.clientWidth - 40) / width, (viewport.clientHeight - 40) / height, 1));
  }
  diagrams.forEach(diagram => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'diagram-open';
    button.textContent = '⛶ Phóng to sơ đồ';
    diagram.before(button);
    button.addEventListener('click', () => {
      const svg = diagram.querySelector('svg');
      if (!svg) return;
      active = svg;
      origin = diagram;
      oldStyle = svg.getAttribute('style');
      width = svg.viewBox.baseVal.width || svg.getBoundingClientRect().width;
      height = svg.viewBox.baseVal.height || svg.getBoundingClientRect().height;
      viewport.append(svg);
      dialog.showModal();
      fit();
    });
  });
  dialog.addEventListener('click', event => {
    const action = event.target.closest('button')?.dataset.action;
    if (!active) return;
    if (action === 'in') resize(zoom * 1.25);
    if (action === 'out') resize(zoom / 1.25);
    if (action === 'fit') fit();
    if (action === 'close') dialog.close();
  });
  dialog.addEventListener('close', () => {
    if (!active) return;
    if (oldStyle === null) active.removeAttribute('style');
    else active.setAttribute('style', oldStyle);
    origin.append(active);
    active = null;
  });
})();
</script>
