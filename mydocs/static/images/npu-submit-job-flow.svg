<svg xmlns="http://www.w3.org/2000/svg" width="470" height="434" viewBox="0 0 470 434" role="img" aria-labelledby="title desc">
<title id="title">NPU submit job flow</title><desc id="desc">Luồng theo hình mẫu: kiểm tra hàng đợi, trả về -1 nếu đầy; điền descriptor, flush dữ liệu chia sẻ, fence rw, w, cập nhật tail, ghi doorbell và NPU đọc descriptor để chạy job.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#92958c" stroke-width="1.2"/></marker></defs>
<rect width="470" height="434" fill="white"/><g font-family="Arial, Helvetica, sans-serif">
<rect x="121.5" y="18" width="231" height="43" rx="6" fill="#f1efe8" stroke="#b7b7ad" stroke-width=".8"/><text x="237" y="36" text-anchor="middle" font-size="11" fill="#5c5f56" font-weight="600">Kiểm tra hàng đợi</text><text x="237" y="51" text-anchor="middle" font-size="9.5" fill="#818478">next_tail == head → đầy</text><path d="M237 61V78" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="121.5" y="79" width="231" height="43" rx="6" fill="#e1f4ed" stroke="#83c2b1" stroke-width=".8"/><text x="237" y="97" text-anchor="middle" font-size="11" fill="#236e5e" font-weight="600">Điền descriptor</text><text x="237" y="112" text-anchor="middle" font-size="9.5" fill="#389780">Ghi các trường vào q-&gt;jobs[tail]</text><path d="M237 122V139" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="121.5" y="140" width="231" height="43" rx="6" fill="#e1f4ed" stroke="#83c2b1" stroke-width=".8"/><text x="237" y="158" text-anchor="middle" font-size="11" fill="#236e5e" font-weight="600">Flush dữ liệu chia sẻ</text><text x="237" y="173" text-anchor="middle" font-size="9.5" fill="#389780">cache_flush: cmd_buf + job</text><path d="M237 183V201" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="99" y="202" width="276" height="40" rx="6" fill="#fbefd9" stroke="#cba16c" stroke-width=".8" stroke-dasharray="5 3"/><text x="237" y="220" text-anchor="middle" font-size="11" fill="#86551d" font-weight="600">Hàng rào — fence rw, w</text><text x="237" y="235" text-anchor="middle" font-size="9.5" fill="#a77835">Flush phải hoàn tất trước</text><path d="M237 242V259" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="121.5" y="260" width="231" height="43" rx="6" fill="#fbece7" stroke="#df9b85" stroke-width=".8"/><text x="237" y="278" text-anchor="middle" font-size="11" fill="#994529" font-weight="600">Cập nhật tail</text><text x="237" y="293" text-anchor="middle" font-size="9.5" fill="#bb7055">q-&gt;tail = next_tail, rồi flush</text><path d="M237 303V320" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="121.5" y="321" width="231" height="43" rx="6" fill="#fbece7" stroke="#df9b85" stroke-width=".8"/><text x="237" y="339" text-anchor="middle" font-size="11" fill="#994529" font-weight="600">Ghi doorbell</text><text x="237" y="354" text-anchor="middle" font-size="9.5" fill="#bb7055">mmio_write32(DOORBELL, job_id)</text><path d="M237 364V381" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="121.5" y="382" width="231" height="43" rx="6" fill="#f1efe8" stroke="#b7b7ad" stroke-width=".8"/><text x="237" y="400" text-anchor="middle" font-size="11" fill="#5c5f56" font-weight="600">NPU đọc &amp; chạy job</text><text x="237" y="415" text-anchor="middle" font-size="9.5" fill="#818478">Theo tail → đọc descriptor</text><path d="M353 39.5H373" fill="none" stroke="#92958c" stroke-width="1.1" marker-end="url(#arrow)"/><rect x="376.5" y="27.5" width="83" height="25" rx="5" fill="#fcecec" stroke="#e89191" stroke-width=".8"/><text x="418" y="44" text-anchor="middle" font-size="9" fill="#cb5151">return -1</text><text x="53" y="190" text-anchor="middle" font-size="9.5" fill="#74766f">Không vượt fence</text><path d="M121 277C82 270 59 266 60 250" fill="none" stroke="#ff565b" stroke-dasharray="3 3"/><path d="M55 244L66 255 M66 244L55 255" fill="none" stroke="#ff565b" stroke-width="1.3" stroke-linecap="round"/></g></svg>
