<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">CPU–NPU Communication Flow</title>
<desc id="desc">Two flows: CPU submits work through shared memory and MMIO doorbell; NPU reports completion through status registers and an interrupt, then CPU invalidates the output buffer and reads the result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#89918d" stroke-width="1.2"/></marker><marker id="signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#bc7b19" stroke-width="1.2"/></marker></defs>
<rect width="1000" height="570" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="20" y="34" text-anchor="start" font-size="15" font-weight="600" fill="#40443f">Từ CPU → NPU · giao việc</text>
<text x="510" y="37" text-anchor="start" font-size="15" font-weight="600" fill="#40443f">Từ NPU → CPU · báo xong</text>
<rect x="20" y="45" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">1 · Load model artifact</text>
<path d="M235 91V110" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="110" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="139" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">2 · Build command buffer</text>
<path d="M235 156V175" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="175" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">3 · Write job descriptor → shared queue</text>
<path d="M235 221V240" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="240" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">4 · Flush command buffer + queue cache</text>
<path d="M235 286V305" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="305" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">5 · Update queue tail</text>
<path d="M235 351V370" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="370" width="430" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="235" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">6 · Write MMIO DOORBELL register</text>
<path d="M235 416V435" fill="none" stroke="#bc7b19" stroke-width="1.2" marker-end="url(#signal)"/>
<text x="244" y="430" text-anchor="start" font-size="12" font-weight="400" fill="#ac741e">đánh thức NPU</text>
<rect x="20" y="435" width="430" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="235" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">7 · NPU Rocket wakes up / polls</text>
<path d="M235 481V500" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="20" y="500" width="430" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="235" y="529" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">8 · Read queue → execute command buffer</text>
<rect x="510" y="49" width="447" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="733.5" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">1 · NPU finishes job</text>
<path d="M733.5 95V117" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="510" y="117" width="447" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="733.5" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">2 · Write job status = DONE / ERROR</text>
<path d="M733.5 163V185" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="510" y="185" width="447" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="733.5" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">3 · Write NPU_DONE / IRQ_STATUS register</text>
<path d="M733.5 231V253" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="510" y="253" width="447" height="46" rx="8" fill="#efecfe" stroke="#b6aaff"/>
<text x="733.5" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#5043a2">4 · NPU_CTRL raises interrupt → CPU</text>
<path d="M733.5 299V321" fill="none" stroke="#bc7b19" stroke-width="1.2" marker-end="url(#signal)"/>
<text x="742.5" y="316" text-anchor="start" font-size="12" font-weight="400" fill="#ac741e">ngắt CPU (IRQ)</text>
<rect x="510" y="321" width="447" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="733.5" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">5 · CPU ISR clears interrupt</text>
<path d="M733.5 367V389" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="510" y="389" width="447" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="733.5" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">6 · Invalidate output buffer</text>
<path d="M733.5 435V457" fill="none" stroke="#89918d" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="510" y="457" width="447" height="46" rx="8" fill="#e6f1fc" stroke="#87b6ec"/>
<text x="733.5" y="486" text-anchor="middle" font-size="14" font-weight="600" fill="#245c94">7 · Read result</text>
</g>
</svg>
