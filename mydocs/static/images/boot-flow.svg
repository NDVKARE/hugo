<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V Boot Flow</title>
  <desc id="desc">Power On đến BootROM, OpenSBI, U-Boot, Linux Kernel và User Space</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f9fafb" font-family="Arial, sans-serif" font-size="30" font-weight="700">RISC-V Boot Flow</text>
  <text x="60" y="94" fill="#9ca3af" font-family="Arial, sans-serif" font-size="16">Từ reset vector đến Linux user space</text>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <g fill="#172554" stroke="#60a5fa" stroke-width="2">
      <rect x="45" y="145" width="145" height="62" rx="12"/><rect x="238" y="145" width="145" height="62" rx="12"/>
      <rect x="431" y="145" width="145" height="62" rx="12"/><rect x="624" y="145" width="145" height="62" rx="12"/>
      <rect x="817" y="145" width="145" height="62" rx="12"/><rect x="1010" y="145" width="145" height="62" rx="12"/>
    </g>
    <g fill="#eff6ff">
      <text x="117" y="183">Power On</text><text x="310" y="183">BootROM</text><text x="503" y="183">OpenSBI</text>
      <text x="696" y="183">U-Boot</text><text x="889" y="183">Linux Kernel</text><text x="1082" y="183">User Space</text>
    </g>
  </g>
  <g stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)">
    <line x1="194" y1="176" x2="228" y2="176"/><line x1="387" y1="176" x2="421" y2="176"/>
    <line x1="580" y1="176" x2="614" y2="176"/><line x1="773" y1="176" x2="807" y2="176"/>
    <line x1="966" y1="176" x2="1000" y2="176"/>
  </g>
</svg>
