<svg xmlns="http://www.w3.org/2000/svg" width="594" height="362" viewBox="0 0 594 362" role="img" aria-labelledby="title desc">
  <title id="title">Đồng bộ cache CPU — DRAM chia sẻ — NPU</title>
  <desc id="desc">CPU có cache riêng, NPU không snoop. CPU flush input, weight, cmd_buf, job và tail vào DRAM trước khi fence và ghi DOORBELL. NPU đọc dữ liệu từ DRAM và ghi kết quả trở lại; CPU invalidate output và job trước khi đọc.</desc>
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#21ad89" stroke-width="1.2"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#f06b45" stroke-width="1.2"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c67d20" stroke-width="1.2"/></marker>
  </defs>
  <rect width="594" height="362" fill="#fff"/>
  <g fill="#f1efe8" stroke="#b4b4ab" stroke-width=".9">
    <rect x="21.5" y="63.5" width="120" height="277" rx="12"/>
    <rect x="238.5" y="63.5" width="120" height="277" rx="12"/>
    <rect x="455" y="63.5" width="120" height="277" rx="12"/>
  </g>
  <rect x="252.5" y="117.5" width="92" height="110.5" rx="7" fill="#e1f4ed" stroke="#7dbbaa" stroke-width=".9"/>
  <rect x="252.5" y="267" width="92" height="59" rx="7" fill="#fbece7" stroke="#dd977e" stroke-width=".9"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="13" font-weight="600" fill="#50534b">
      <text x="81.5" y="90">CPU</text>
      <text x="298.5" y="90">DRAM chia sẻ</text>
      <text x="515" y="90">NPU</text>
      <text x="298.5" y="138" fill="#216d5b">Flush trước</text>
      <text x="298.5" y="287" fill="#98472d">Invalidate</text>
    </g>
    <g font-size="11" fill="#77796f">
      <text x="81.5" y="107">Có cache riêng</text>
      <text x="515" y="107">Không snoop</text>
    </g>
    <g font-size="11" fill="#2c9178">
      <text x="298.5" y="157">input</text>
      <text x="298.5" y="174">weight</text>
      <text x="298.5" y="190">cmd_buf</text>
      <text x="298.5" y="206">job</text>
      <text x="298.5" y="223">tail</text>
    </g>
    <g font-size="11" fill="#be6043">
      <text x="298.5" y="305">output</text>
      <text x="298.5" y="321">job</text>
    </g>
    <g font-size="11" fill="#60635b">
      <text x="298.5" y="34">fence → ghi DOORBELL</text>
      <text x="188.5" y="128">flush (clean)</text>
      <text x="406" y="128">NPU đọc</text>
      <text x="188.5" y="280">invalidate + đọc</text>
      <text x="406" y="280">NPU ghi</text>
    </g>
  </g>
  <g fill="none" stroke-width="1.3">
    <path d="M146 47H451" stroke="#c67d20" stroke-dasharray="5 4" marker-end="url(#gold)"/>
    <path d="M142 137.5H235" stroke="#21ad89" marker-end="url(#green)"/>
    <path d="M362 137.5H453" stroke="#21ad89" marker-end="url(#green)"/>
    <path d="M235 289.5H143" stroke="#f06b45" marker-end="url(#orange)"/>
    <path d="M453 289.5H362" stroke="#f06b45" marker-end="url(#orange)"/>
  </g>
</svg>
